version: '3.8'

services:
  api:
    build: .
    container_name: ai_research_team_api
    ports:
      - "8000:8000"
    volumes:
      # ? Mount the local database file to persist data across container restarts
      - ./jobs.db:/app/jobs.db
    env_file:
      # * Load environment variables (like OPENAI_API_KEY) from .env
      - .env
    restart: unless-stopped